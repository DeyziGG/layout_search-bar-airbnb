<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div
      class="search search__big"
      data-qa="big"
    >
      <img
        src="../src/images/Search.svg"
        alt="search--img"
        class="search--img--big"
      />

      <input
        class="search__bars__big"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </div>

    <div
      class="search search__small"
      data-qa="small"
    >
      <img
        src="../src/images/Search.svg"
        alt="search--img"
        class="search--img--small"
      />

      <input
        class="search__bars__small"
        type="text"
        placeholder="Try “Los Angeles“"
      />
    </div>
  </body>
</html>
